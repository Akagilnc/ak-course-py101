<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Python 101 L4 · pandas intro preview</title>
  <style>
    :root {
      --paper: #f4efdf;
      --ink: #162117;
      --muted: #66705e;
      --green: #1d6f4d;
      --green-dark: #0f3d2d;
      --gold: #d9972f;
      --shadow: rgba(22, 33, 23, 0.18);
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a211b;
      color: var(--ink);
      font-family: "Songti SC", "STSong", "Noto Serif CJK SC", serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 14% 18%, rgba(217, 151, 47, 0.25), transparent 28%),
        radial-gradient(circle at 86% 82%, rgba(29, 111, 77, 0.22), transparent 28%),
        linear-gradient(135deg, #efe2bd, #f8f4e9 38%, #e2e9d0);
      z-index: -2;
    }

    .deck {
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    .slide {
      width: 100vw;
      height: 100vh;
      padding: 96px 86px 64px;
      position: absolute;
      inset: 0;
      overflow: hidden;
      background:
        linear-gradient(120deg, rgba(255, 255, 255, 0.64), rgba(255, 255, 255, 0.24)),
        var(--paper);
      display: flex;
      flex-direction: column;
    }

    .slide::after {
      content: "";
      position: absolute;
      right: -210px;
      bottom: -250px;
      width: 560px;
      height: 560px;
      border-radius: 46% 54% 49% 51%;
      background: rgba(29, 111, 77, 0.12);
      z-index: 0;
    }

    .slide > * {
      position: relative;
      z-index: 1;
    }

    .eyebrow {
      margin: 0 0 20px;
      color: var(--green);
      font-family: "Kaiti SC", "STKaiti", "Songti SC", serif;
      font-size: 34px;
      letter-spacing: 0.08em;
    }

    h1,
    h2,
    h3 {
      margin: 0;
      line-height: 1.05;
      font-weight: 800;
    }

    h2 {
      max-width: 1500px;
      font-size: 76px;
      letter-spacing: -0.03em;
    }

    .lead {
      max-width: 1380px;
      margin: 34px 0 0;
      color: #293527;
      font-size: 44px;
      line-height: 1.35;
    }

    .three-col {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 32px;
      margin-top: 54px;
    }

    .card {
      min-height: 260px;
      padding: 34px 38px;
      border: 3px solid rgba(22, 33, 23, 0.12);
      border-radius: 34px;
      background: rgba(255, 255, 255, 0.58);
      box-shadow: 0 24px 60px var(--shadow);
    }

    .card.dark {
      background: var(--green-dark);
      color: #f5f0da;
      border-color: transparent;
    }

    .card h3 {
      margin: 0 0 18px;
      color: var(--green-dark);
      font-size: 46px;
    }

    .card.dark h3 {
      color: #f5f0da;
    }

    .card p {
      margin: 0;
      color: #293527;
      font-size: 38px;
      line-height: 1.28;
    }

    .card.dark p {
      color: #f5f0da;
      opacity: 0.94;
    }

    .callout {
      margin-top: 46px;
      padding: 36px 44px;
      border-left: 18px solid var(--gold);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.72);
      font-size: 48px;
      line-height: 1.25;
    }

    .mini-note {
      margin-top: 30px;
      color: var(--muted);
      font-size: 32px;
      line-height: 1.28;
    }
  </style>
</head>
<body>
  <main class="deck">
    <section class="slide">
      <p class="eyebrow">pandas 是什么</p>
      <h2>Python 里的表格处理工具</h2>
      <p class="lead">前面我们已经会让 Python 读 JSON、写 txt。接下来，如果数据开始像“一张表”，就该 pandas 登场了。</p>

      <div class="three-col">
        <div class="card">
          <h3>Excel 表</h3>
          <p>一行一行、一列一列的数据。</p>
        </div>
        <div class="card">
          <h3>订单 / 报名 / 流水</h3>
          <p>现实工作里最常见的数据形态。</p>
        </div>
        <div class="card dark">
          <h3>pandas</h3>
          <p>帮 Python 更方便地处理这些表格数据。</p>
        </div>
      </div>

      <div class="callout">今天先知道一件事：当数据开始像表格，pandas 就该登场。</div>
      <p class="mini-note">下一页再认识它最常见的对象：DataFrame。</p>
    </section>
  </main>
</body>
</html>
